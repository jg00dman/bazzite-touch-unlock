# Handheld defaults for unl0kr (bazzite-touch-unlock).
# Override in /etc/unl0kr.conf.d/ (then run: sudo ./setup.sh --regenerate).

[general]
animations=false
# fbdev works widely; try backend=drm if the screen stays blank.
backend=fbdev
timeout=0

[keyboard]
# Must stay visible: the Steam Deck controller appears as a hardware
# keyboard (lizard mode), which would otherwise hide the on-screen keyboard.
autohide=false
layout=us
popovers=true

[textarea]
obscured=true

[theme]
default=breezy-dark
alternative=breezy-light

[input]
keyboard=true
pointer=true
touchscreen=true
