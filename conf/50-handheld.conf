# Handheld defaults for unl0kr (bazzite-touch-unlock).
# Override in /etc/unl0kr.conf.d/ (then run: sudo ./setup.sh --regenerate).

[general]
animations=false
# Bazzite's kernel has no /dev/fb* devices, so the framebuffer backend can't work.
backend=drm
timeout=0

[keyboard]
# Must stay visible: the Steam Deck controller appears as a hardware
# keyboard (lizard mode), which would otherwise hide the on-screen keyboard.
autohide=false
layout=us
popovers=true
# Avoids continuous vibration reported on handhelds.
haptic_feedback=false

[textarea]
obscured=true

[theme]
default=breezy-dark
alternative=breezy-light

[input]
keyboard=true
pointer=true
touchscreen=true
