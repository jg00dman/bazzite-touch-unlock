name: Build RPMs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the Fedora releases Bazzite is based on.
        fedora: ['44', '45']
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install git for checkout
        run: dnf -y install git
      - uses: actions/checkout@v4
      - name: Build
        env:
          SRC: ${{ github.workspace }}
        run: bash scripts/container-build.sh
      - name: Check initramfs contents
        env:
          SRC: ${{ github.workspace }}
        run: bash scripts/check-initramfs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpms-fedora-${{ matrix.fedora }}
          path: |
            dist/*.rpm
            dist/deps/*.rpm

  publish:
    # Publish every successful main build as the "test-build" release, so
    # quick-test.sh can download it without a GitHub login.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          body: |
            Built automatically from main. Not yet tested on hardware;
            run quick-test.sh (see README) before installing.
          prerelease: true
          files: |
            dist/*.rpm
            dist/deps/*.rpm
