name: Build RPMs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the Fedora releases Bazzite is based on.
        fedora: ['43', '44']
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install git for checkout
        run: dnf -y install git
      - uses: actions/checkout@v4
      - name: Build
        env:
          SRC: ${{ github.workspace }}
        run: bash scripts/container-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpms-fedora-${{ matrix.fedora }}
          path: |
            dist/*.rpm
            dist/deps/*.rpm
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/deps/*.rpm
